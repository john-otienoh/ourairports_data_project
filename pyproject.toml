[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
 
[project]
name = "ourairports_data_project"
version = "0.1.0"
description = "Global aviation infrastructure intelligence platform built on the OurAirports open dataset"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "John Charles Otieno" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "duckdb",
    "pandas",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-dotenv",
]
 
[project.optional-dependencies]
de = [
    "dbt-core",
    "dbt-duckdb",
    "dbt-postgres",
]

dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "pre-commit",
    "httpx",
    "alembic",
]
 
[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "ingestion*", "ml*"]
